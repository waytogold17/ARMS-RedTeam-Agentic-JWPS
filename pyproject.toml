[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arms-redteam"
version = "1.0.0"
description = "Red Team agentique (5 agents Agno) contre une simulation du système ARMS : DORA, MiCA, AI Act"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.10"
dependencies = [
  "agno>=2.0",
  "openai>=1.40",
  "ollama>=0.4",
  "httpx>=0.27",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
redteam = "redteam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
